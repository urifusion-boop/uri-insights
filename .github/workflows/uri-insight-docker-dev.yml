name: Build and Deploy Dockerized Python FastAPI App to Azure VM

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: Run tests
      # Uncomment and adjust the following lines to run tests if applicable
      # - name: Run tests
      #   run: pytest

      # Set up Docker Buildx for building multi-platform images (optional)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build and push Docker images (API + Worker)
      - name: Build and push Docker images
        run: |
          docker build -t uriteam/urisvc:uriinsightdev .
          docker push uriteam/urisvc:uriinsightdev
          docker build -t uriteam/urisvc:uriinsightprod .
          docker push uriteam/urisvc:uriinsightprod
          docker build -f Dockerfile.worker -t uriteam/urisvc:uriinsightworkerdev .
          docker push uriteam/urisvc:uriinsightworkerdev
          docker build -f Dockerfile.worker -t uriteam/urisvc:uriinsightworkerprod .
          docker push uriteam/urisvc:uriinsightworkerprod

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Checkout the code to access docker-compose.yml
      - uses: actions/checkout@v4

      # Copy docker-compose file to VM
      - name: Copy docker-compose.dev.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP_DEV }}
          username: uridev
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          source: "./docker-compose.dev.yml"
          target: "~/uri-insights/"
          strip_components: 0

      # SSH into the VM and deploy the Docker container
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_IP_DEV }}
          username: uridev
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          port: 22 # Adjust if using a different port
          timeout: 120s # SSH connection timeout
          command_timeout: 15m # Command execution timeout
          script: |
            if [ ! -d ~/uri-insights ]; then
              mkdir -p ~/uri-insights;
            fi
            cd ~/uri-insights
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
            docker-compose -f docker-compose.dev.yml down
            docker-compose -f docker-compose.dev.yml pull
            docker-compose -f docker-compose.dev.yml up -d

            # Cleanup redundant image
            docker image prune -f
