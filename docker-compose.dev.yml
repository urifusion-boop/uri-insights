version: "3.9"

services:
  uri-insight.api:
    image: uriteam/urisvc:uriinsightdev
    container_name: uri-insight.api
    env_file:
      - .env
    environment:
      - ENV=Development
    restart: always
    ports:
      - "9002:80"
      - "9445:443"

  uri-insight.worker:
    image: uriteam/urisvc:uriinsightworkerdev
    env_file:
      - .env
    environment:
      - ENV=Development
    restart: always
    deploy:
      replicas: 5
    # Worker processes background jobs from Azure Service Bus queue
    # No ports needed - this service only consumes from queue

networks:
  uritest-network:
    external: true
