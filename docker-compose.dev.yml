version: "3.9"

services:
  uri-insight.api:
    image: uriteam/urisvc:uriinsightdev
    container_name: uri-insight.api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--workers", "8"]
    env_file:
      - .env
    environment:
      - ENV=Development
    restart: always
    ports:
      - "9002:80"
    networks:
      - uritest-network

  uri-insight.worker:
    image: uriteam/urisvc:uriinsightworkerdev
    env_file:
      - .env
    environment:
      - ENV=Development
    restart: always
    deploy:
      replicas: 5
    networks:
      - uritest-network
    # Worker processes background jobs from Azure Service Bus queue
    # No ports needed - this service only consumes from queue

networks:
  uritest-network:
    external: true
