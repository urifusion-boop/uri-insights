version: "3.9"

services:
  uri-insight-prod.api:
    image: uriteam/urisvc:uriinsightprod
    container_name: uri-insight-prod.api
    env_file:
      - .env
    environment:
      - ENV=Production
      - SSL_CERT_PATH=/https/fullchain.pem
      - SSL_KEY_PATH=/https/privkey.pem
    volumes:
      - /etc/letsencrypt/live/api.uricreative.com/fullchain.pem:/https/fullchain.pem
      - /etc/letsencrypt/live/api.uricreative.com/privkey.pem:/https/privkey.pem
    restart: always
    ports:
      - "9002:80"
      - "9445:443"
    networks:
      - uritest-network

  uri-insight-prod.worker:
    image: uriteam/urisvc:uriinsightworkerprod
    env_file:
      - .env
    environment:
      - ENV=Production
    restart: always
    networks:
      - uritest-network

networks:
  uritest-network:
    external: true
